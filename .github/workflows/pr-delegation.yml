name: Pull Requests (delegation)

on:
  workflow_run:
    workflows: [Pull Requests]
    types: [completed]

jobs:
  delegate-main-repo:
    name: Delegate to the main repository
    runs-on: ["ubuntu-latest"]
    permissions:
      checks: write
      actions: read
    env:
      PR_METADATA_FILE: pr_metadata.json
      CHECK_NAME: SEAPATH Yocto delegated CI
    steps:
      - name: Download PR metadata
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PR_METADATA_FILE }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Process PR metadata
        id: pr-metadata
        run: |
          echo "number=$(jq -r '.pr_number' "$PR_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.pr_head_sha' "$PR_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r '.pr_sha' "$PR_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.pr_base_ref' "$PR_METADATA_FILE")" >> "$GITHUB_OUTPUT"

      - name: Create delegated check
        id: create-check
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          name: ${{ env.CHECK_NAME }}
          sha: ${{ steps.pr-metadata.outputs.head_sha }}
          status: in_progress
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title":"Weekly-baseline CI dispatched","summary":"The central build is running asynchronously; this check will be finalized from its workflow result."}

      - name: Create dispatch token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write

      - name: Dispatch central PR workflow (asynchronous)
        id: delegation
        uses: benc-uk/workflow-dispatch@70455941930e5212314c10c0e38ec94986096618
        with:
          workflow: pr.yml
          repo: ${{ vars.MAIN_REPO }}
          ref: ${{ steps.pr-metadata.outputs.base_ref }}
          token: ${{ steps.app-token.outputs.token }}
          wait-for-completion: false
          sync-status: false
          inputs: |
            {
              "origin_repository": "${{ github.repository }}",
              "origin_sha": "${{ steps.pr-metadata.outputs.head_sha }}",
              "origin_run_id": "${{ github.run_id }}",
              "origin_pr_number": "${{ steps.pr-metadata.outputs.number }}",
              "baseline_manifest_name": "weekly.xml",
              "callback_repository": "${{ github.repository }}",
              "callback_sha": "${{ steps.pr-metadata.outputs.head_sha }}",
              "callback_check_id": "${{ steps.create-check.outputs.check_id }}"
            }

      - name: Update delegated check with remote run
        if: steps.delegation.outcome == 'success'
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          check_id: ${{ steps.create-check.outputs.check_id }}
          status: in_progress
          details_url: ${{ steps.delegation.outputs.runUrlHtml || github.server_url }}
          output: |
            {"title":"Central build dispatched","summary":"The build is running asynchronously. Remote workflow: ${{ steps.delegation.outputs.runUrlHtml || 'see main repository Actions' }}"}

      - name: Fail check when dispatch fails
        if: steps.delegation.outcome != 'success'
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          check_id: ${{ steps.create-check.outputs.check_id }}
          status: completed
          conclusion: failure
          output: |
            {"title":"Central build dispatch failed","summary":"The central workflow could not be started."}
