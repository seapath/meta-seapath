name: Build on push

on:
  push:
    branches: [wrynose]
    paths-ignore: [.github/**/*]
  workflow_dispatch:

jobs:
  delegate-main-repo:
    name: Delegate to the main repository
    runs-on: ["ubuntu-latest"]
    permissions:
      checks: write
      actions: read
    steps:
      - name: Create delegated check
        id: create-check
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          name: SEAPATH Yocto delegated CI
          sha: ${{ github.sha }}
          status: in_progress
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {"title":"Weekly-baseline CI dispatched","summary":"The central build is running asynchronously."}

      - name: Create dispatch token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write

      - name: Dispatch central build workflow (asynchronous)
        id: delegation
        uses: benc-uk/workflow-dispatch@70455941930e5212314c10c0e38ec94986096618
        with:
          workflow: push.yml
          repo: ${{ vars.MAIN_REPO }}
          ref: wrynose
          token: ${{ steps.app-token.outputs.token }}
          wait-for-completion: false
          sync-status: false
          inputs: |
            {
              "origin_repository": "${{ github.repository }}",
              "origin_sha": "${{ github.sha }}",
              "origin_run_id": "${{ github.run_id }}",
              "callback_repository": "${{ github.repository }}",
              "callback_sha": "${{ github.sha }}",
              "callback_check_id": "${{ steps.create-check.outputs.check_id }}"
            }

      - name: Update delegated check with remote run
        if: steps.delegation.outcome == 'success'
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          check_id: ${{ steps.create-check.outputs.check_id }}
          status: in_progress
          details_url: ${{ steps.delegation.outputs.runUrlHtml || github.server_url }}
          output: |
            {"title":"Central build dispatched","summary":"Remote workflow: ${{ steps.delegation.outputs.runUrlHtml || 'see main repository Actions' }}"}

      - name: Fail check when dispatch fails
        if: steps.delegation.outcome != 'success'
        uses: LouisBrunner/checks-action@dfcbcf801bff1ea7f1414824fc28f2cd697b35da
        with:
          token: ${{ github.token }}
          check_id: ${{ steps.create-check.outputs.check_id }}
          status: completed
          conclusion: failure
          output: |
            {"title":"Central build dispatch failed","summary":"The central workflow could not be started."}
