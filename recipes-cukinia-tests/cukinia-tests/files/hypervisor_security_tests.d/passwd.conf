. /usr/share/cukinia/includes/clustering_functions

passwd=" \
    root \
    daemon \
    sync \
    qemu \
    systemd-bus-proxy \
    systemd-timesync \
    systemd-resolve \
    systemd-network \
    sshd \
    messagebus \
    admin \
    emergadmin \
    nobody \
    openvswitch \
    snmp \
"

if is_seapath_clustering_enable; then
    passwd+=" \
        ceph \
        hacluster \
        livemigration \
    "
fi

args="-v"
for g in ${passwd}; do
    args="$args -e $g"
done

cukinia_log "$(_colorize yellow "--- check /etc/passwd ---")"
nb_passwd=$(echo $passwd | wc -w)
id "SEAPATH-00047" as "/etc/passwd is consistent" cukinia_test $(grep $args /etc/passwd | wc -l) -eq 0
id "SEAPATH-00048" as "/etc/passwd does not include extra user" cukinia_test $(cat /etc/passwd | wc -l) -eq $nb_passwd
