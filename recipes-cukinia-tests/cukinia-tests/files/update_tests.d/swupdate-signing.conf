cukinia_log "$(_colorize yellow "--- Check SWUpdate signing and trust configuration ---")"

# The trust configuration is only installed in production-capable images;
# skip the related tests where it is absent (e.g. debug images).
swupdate_trust_configured() {
    [ -f /etc/swupdate.cfg ] && [ -f /etc/swupdate/ca-chain.pem ]
}

when "swupdate_trust_configured" \
id "SEAPATH-00197" as "SWUpdate trust anchor bundle is installed" \
    cukinia_test -s /etc/swupdate/ca-chain.pem

when "swupdate_trust_configured" \
id "SEAPATH-00198" as "SWUpdate trust anchor bundle is only readable by root" \
    cukinia_test "$(stat -c "%a %U %G" /etc/swupdate/ca-chain.pem)" \
    == "600 root root"

when "swupdate_trust_configured" \
id "SEAPATH-00199" as "SWUpdate configuration is only readable by root" \
    cukinia_test "$(stat -c "%a %U %G" /etc/swupdate.cfg)" == "600 root root"

when "swupdate_trust_configured" \
id "SEAPATH-00172" as "SWUpdate configuration sets the trust anchor, the codeSigning purpose and a downgrade floor" \
    cukinia_test "$(grep -Ec '^[[:space:]]*public-key-file = "/etc/swupdate/ca-chain.pem";|^[[:space:]]*cert-purpose = "codeSigning";|^[[:space:]]*no-downgrading = "[0-9][^"]*";' /etc/swupdate.cfg)" \
    -eq 3

id "SEAPATH-00173" as "SWUpdate enforces signed images at runtime" \
    cukinia_test "$(swupdate -h 2>&1 | grep -c -- '--cert-purpose')" -ge 1
