# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend \
	${LAYERDIR}/classes/security/* \
"

WIC_IMAGES_DIR = "${LAYERDIR}/wic"
SEC_ARTIFACTS_DIR = "${LAYERDIR}/classes/security/artifacts"
UEFI_SECUREBOOT_KEYS_DIR = "${LAYERDIR}/../../keys"
CUKINIA_TESTS_DIR = "${LAYERDIR}/recipes-cukinia-tests/cukinia-tests"

# SWUpdate CMS signing key material. By default it lives next to the UEFI
# Secure Boot keys, under the git-ignored keys/ directory. Every path can be
# overridden by the SEAPATH_SWUPDATE_* variables exported from seapath.conf
# through build.sh, so CI and release builds can point at another key store.
SWUPDATE_KEYS_DIR ?= "${@d.getVar('SEAPATH_SWUPDATE_KEYS_DIR') or '${UEFI_SECUREBOOT_KEYS_DIR}/swupdate-keys'}"
SWUPDATE_CA_CERTS_DIR ?= "${@d.getVar('SEAPATH_SWUPDATE_CA_CERTS_DIR') or '${SWUPDATE_KEYS_DIR}/ca'}"

BBFILE_COLLECTIONS += "meta-seapath"
BBFILE_PATTERN_meta-seapath = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-seapath = "20"

LAYERSERIES_COMPAT_meta-seapath = "wrynose"
LAYERDEPENDS_meta-seapath = "efi-secure-boot"

BBMASK += "${LAYERDIR}/../meta-virtualization/recipes-extended/ceph"
